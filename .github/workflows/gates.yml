name: gates

# Push runs on main validate the merge and save the warm caches; pull request
# runs restore them and never save, so every branch starts from main's warm world.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        id: zigtool
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: pr body shape
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          zig build gate -- --pr-body "$RUNNER_TEMP/pr_body.txt"
      - name: commit provenance
        if: github.event_name == 'pull_request'
        run: |
          zig build gate -- --log "origin/${{ github.base_ref }}..HEAD"
          zig build gate -- --diff "origin/${{ github.base_ref }}..HEAD"
      - uses: actions/cache/restore@v4
        id: zigcache
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}
          restore-keys: |
            zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-
      - name: gate suite
        run: zig build ci
      - name: conformance
        run: zig build conformance
      - name: c example
        run: zig build c-example
      - name: c package
        run: zig build c
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            .zig-cache
            ~/.cache/zig
          key: zigcache-${{ runner.os }}-${{ hashFiles('.zigversion') }}-${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
      - name: build and test
        working-directory: sdk/ts
        run: |
          bun install
          bun run build
          bun run typecheck
          bun test

  apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - name: xcframework and swift tests
        run: |
          tools/build-xcframework.sh
          swift test

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .local/zig
          key: zig-${{ runner.os }}-${{ hashFiles('.zigversion') }}
      - name: toolchain
        run: |
          tools/toolchain-sync
          echo "$PWD/.local/zig/current" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: jni libraries
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          zig build jni android -Doptimize=ReleaseFast
      - name: kotlin tests and aar
        working-directory: sdk/kotlin
        run: ./gradlew :lib:testDebugUnitTest :lib:assembleRelease --console=plain
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
